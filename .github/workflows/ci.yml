name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build first: `style` resolves `@sumisonic/bezier-kit-core` through the workspace link to
      # `packages/core/dist`, so lint (typed rules) and typecheck of `packages/style` need core's dist.
      # Running check before build made every run since 0.1.0 fail with `no-unsafe-*` on style's specs.
      - name: Build
        run: pnpm run build

      - name: Lint + typecheck + format:check
        run: pnpm run check

      - name: Test
        run: pnpm run test:run
